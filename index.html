<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Ordering System</title>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Order Form Card -->
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Request Pizza</h3>
                    </div>
                    <div class="card-body">
                        <form id="orderForm">
                            <div class="mb-3">
                                <label for="locationSelect" class="form-label">Service Location</label>
                                <select class="form-select" id="locationSelect" required disabled>
                                    <option value="" selected disabled>Loading locations...</option>
                                </select>
                                <div class="form-text">Select the area requesting the pizza.</div>
                            </div>

                            <div class="mb-3">
                                <label for="pizzaSelect" class="form-label">Pizza Variety</label>
                                <select class="form-select" id="pizzaSelect" required disabled>
                                    <option value="" selected disabled>Loading pizza varieties...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="quantityInput" class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="quantityInput" min="1" value="1" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" id="submitBtn" class="btn btn-success" disabled>Submit Request to Kitchen</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Order History Card -->
                <div class="card shadow">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">Active Kitchen Requests</h4>
                    </div>
                    <div class="card-body p-0">
                        <div id="noOrdersMessage" class="text-muted text-center py-4">No active requests.</div>
                        <ul class="list-group list-group-flush" id="orderList"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

 <script>
        // 1. Initialize Supabase (Replace with your actual Supabase Project credentials)
        const SUPABASE_URL = 'https://jdfrifcmmsqysppsfdds.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YG9QoVQcZ_KLcd0xAKmwoA_5ED1H6jF';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const orderForm = document.getElementById('orderForm');
        const submitBtn = document.getElementById('submitBtn');
        const orderList = document.getElementById('orderList');
        const noOrdersMessage = document.getElementById('noOrdersMessage');
        const locationSelect = document.getElementById('locationSelect');
        const pizzaSelect = document.getElementById('pizzaSelect');

        // Helper function to show/hide the "No active requests" message
        function toggleEmptyMessage() {
            if (orderList.children.length === 0) {
                noOrdersMessage.style.display = 'block';
            } else {
                noOrdersMessage.style.display = 'none';
            }
        }

        // 2. Load Dropdown Data dynamically on Page Load
        async function loadDropdownData() {
            try {
                // Fetch locations (Assumes table name 'locations' with columns 'id' and 'name')
                const { data: locations, error: locError } = await supabase
                    .from('locations')
                    .select('id, name');
                
                if (locError) throw locError;

                // Fetch pizzas (Assumes table name 'pizzas' with columns 'id' and 'name')
                const { data: pizzas, error: pizzaError } = await supabase
                    .from('pizzas')
                    .select('id, name');

                if (pizzaError) throw pizzaError;

                // Populate Location Dropdown
                locationSelect.innerHTML = '<option value="" selected disabled>Choose a location...</option>';
                locations.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc.id;
                    opt.textContent = loc.name;
                    locationSelect.appendChild(opt);
                });
                locationSelect.disabled = false;

                // Populate Pizza Dropdown
                pizzaSelect.innerHTML = '<option value="" selected disabled>Choose a pizza...</option>';
                pizzas.forEach(piz => {
                    const opt = document.createElement('option');
                    opt.value = piz.id;
                    opt.textContent = piz.name;
                    pizzaSelect.appendChild(opt);
                });
                pizzaSelect.disabled = false;

                // Enable the form submit button once data is ready
                submitBtn.disabled = false;

            } catch (err) {
                console.error('Error loading dropdown data:', err);
                locationSelect.innerHTML = '<option value="">Error loading locations</option>';
                pizzaSelect.innerHTML = '<option value="">Error loading pizzas</option>';
                alert('Failed to connect to Supabase. Check your URL/Keys or database tables.');
            }
        }

        // Run data fetching step immediately
        loadDropdownData();

        // 3. Handle Form Submission
        orderForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const locationId = locationSelect.value;
            const locationText = locationSelect.selectedOptions[0].text;
            
            const pizzaId = pizzaSelect.value;
            const pizzaText = pizzaSelect.selectedOptions[0].text;
            
            const qty = parseInt(document.getElementById('quantityInput').value, 10);

            if (!locationId || !pizzaId || isNaN(qty) || qty < 1) {
                alert('Please fill out all fields with valid information.');
                return;
            }

            // Disable button during submission to mock real server delay
            /*

        });
        
    </script>
</body>
</html>
